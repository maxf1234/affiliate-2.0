name: Remove Deal
# Take a single deal off the site:
# GitHub → Actions → "Remove Deal" → Run workflow → enter an id, ASIN, or title.
on:
  workflow_dispatch:
    inputs:
      find:
        description: 'Deal id (man_… / sd_… / sc_…), ASIN, or part of the title'
        required: true
      block:
        description: 'Also stop the scraper re-adding this product?'
        required: false
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      dry_run:
        description: 'Only show what would be removed, change nothing'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
jobs:
  remove-deal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node bot/remove_deal.js
        env:
          FIND: ${{ inputs.find }}
          BLOCK: ${{ inputs.block }}
          DRY_RUN: ${{ inputs.dry_run }}
      - run: |
          git config user.name "DealsPulse Bot"
          git config user.email "bot@dealspulse.com"
          git add public/deals.json
          # Absent on a dry run, or until the first removal with blocking on.
          if [ -f bot/removed.json ]; then git add bot/removed.json; fi
          git diff --staged --quiet || git commit -m "manual: remove deal"
          git push
      - name: Trigger Vercel redeploy
        if: ${{ inputs.dry_run != 'yes' }}
        run: curl -X POST "https://api.vercel.com/v1/integrations/deploy/prj_ORo4O4shiKWVNnQGO8butlHKugDy/JJwu21OuCu"
